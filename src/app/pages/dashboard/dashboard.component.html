<div class="dashboard">
  <div class="stats-row d-flex gap-4">
    @for (stat of statistics$ | async; track stat.id) {
      <app-stat-card [stat]="stat" />
    }
  </div>

  <app-task-filter-bar
    class="mt-4"
    [activeStatus]="activeStatus"
    [activePriority]="activePriority"
    (statusChange)="onStatusChange($event)"
    (priorityChange)="onPriorityChange($event)"
    (newTask)="onNewTask()"
  />

  @if (filteredTasks$ | async; as tasks) {
    @if (taskCounts$ | async; as counts) {
      <app-task-board class="mt-4 d-block" [tasks]="tasks" [counts]="counts" />
    }
  }
</div>
