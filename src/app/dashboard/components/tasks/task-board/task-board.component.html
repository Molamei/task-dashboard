<div class="task-board">
  <!-- TO DO column -->
  <div class="column">
    <div class="column-header">
      <span class="column-title">{{ statusLabels['todo'] }}</span>
      <span class="column-count">{{ counts().todo }}</span>
    </div>
    <div class="column-body">
      @for (task of todoTasks(); track task.id) {
        <app-task-card [task]="task" />
      }
    </div>
  </div>

  <!-- IN PROGRESS column -->
  <div class="column">
    <div class="column-header">
      <span class="column-title">{{ statusLabels['in_progress'] }}</span>
      <span class="column-count">{{ counts().in_progress }}</span>
    </div>
    <div class="column-body">
      @for (task of inProgressTasks(); track task.id) {
        <app-task-card [task]="task" />
      }
    </div>
  </div>

  <!-- DONE column -->
  <div class="column">
    <div class="column-header">
      <span class="column-title">{{ statusLabels['done'] }}</span>
      <span class="column-count">{{ counts().done }}</span>
    </div>
    <div class="column-body">
      @for (task of doneTasks(); track task.id) {
        <app-task-card [task]="task" />
      }
    </div>
  </div>
</div>
