<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Task Manager — Organize your team&#x2019;s work</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Task Manager is a modern dashboard for creating, tracking and prioritizing your team's tasks — all in one place."
    />
    <meta name="theme-color" content="#1976D2" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Inline critical styles to prevent FOUC before external CSS loads -->
    <style>
      body {
        background-color: #f4f6f9;
        color: #374151;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>

    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: CLI will inline @font-face in production (fonts.inline: true in angular.json) -->
    <!-- display=optional: use Inter if ready within ~100ms, otherwise keep system font — eliminates CLS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional"
      rel="stylesheet"
    />
    <!-- display=block: icons are invisible briefly but never cause a layout shift -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
